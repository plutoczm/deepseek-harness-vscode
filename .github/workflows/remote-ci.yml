name: Standalone Remote CI

on:
  push:
    paths:
      - 'remote/**'
      - '.github/workflows/remote-ci.yml'
  pull_request:
    paths:
      - 'remote/**'
      - '.github/workflows/remote-ci.yml'

jobs:
  remote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check standalone launcher and Harness plugin
        working-directory: remote
        run: npm run check
      - name: Unit tests
        working-directory: remote
        run: npm test
      - name: Smoke-test remote plugins with official Harness
        timeout-minutes: 4
        shell: bash
        working-directory: remote
        run: |
          set -euo pipefail
          export DSH_HOME="$RUNNER_TEMP/dsh-remote-smoke"
          export DEEPSEEK_HARNESS_SESSION_ENV_DIR="$RUNNER_TEMP/dsh-remote-session-env"
          export DEEPSEEK_HARNESS_BASE_PATH="$PATH"
          export BASH_ENV="$PWD/harness-plugin/bash-env.sh"

          session_pkg="$DSH_HOME/profiles/node_modules/deepseek-harness-remote-session-env"
          usage_pkg="$DSH_HOME/profiles/node_modules/deepseek-harness-remote-usage-cost"
          mkdir -p "$session_pkg" "$usage_pkg" "$DEEPSEEK_HARNESS_SESSION_ENV_DIR"
          cp harness-plugin/package.json harness-plugin/index.js "$session_pkg/"
          cp harness-plugin/usage-cost.js "$usage_pkg/index.js"
          cp harness-plugin/usage-package.json "$usage_pkg/package.json"

          log="$RUNNER_TEMP/deepseek-harness-remote-web.log"
          npx --yes @deepseek-ai/dsh --profile web --patch "$PWD/harness-plugin/cordis.patch.yml" --port 33081 >"$log" 2>&1 &
          pid=$!
          cleanup() {
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          trap 'cleanup' EXIT

          ready=0
          for _ in $(seq 1 360); do
            if curl -fsS http://127.0.0.1:33081/ >/dev/null 2>&1; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat "$log"
              exit 1
            fi
            sleep 0.5
          done
          if [ "$ready" -ne 1 ]; then
            cat "$log"
            exit 1
          fi

          cleanup
          trap - EXIT
