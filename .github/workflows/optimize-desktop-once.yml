name: Optimize Desktop Once

on:
  push:
    paths:
      - '.github/workflows/optimize-desktop-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - name: Apply performance and release hardening
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import json
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 1) Windows: avoid a second real-time DWM acrylic layer under the app's own skin.
          replace_once(
              'apps/desktop/src/main.ts',
              """    ...(process.platform === 'win32' ? {\n      backgroundMaterial: 'acrylic' as const,\n      hasShadow: true,\n      roundedCorners: true,\n      thickFrame: true,\n    } : {""",
              """    ...(process.platform === 'win32' ? {\n      backgroundMaterial: 'none' as const,\n      backgroundColor: '#07111d',\n      hasShadow: true,\n      roundedCorners: true,\n      thickFrame: true,\n    } : {""",
          )
          replace_once(
              'apps/desktop/src/main.ts',
              """      sandbox: true,\n      webSecurity: true,""",
              """      sandbox: true,\n      webSecurity: true,\n      backgroundThrottling: true,""",
          )

          # 2) Avoid fixed full-HD wallpaper recomposition during scrolling.
          replace_once(
              'packages/client/ui-desktop-customization/src/client/DesktopCustomization.module.css',
              '  background-attachment: fixed, fixed !important;',
              '  background-attachment: scroll, scroll !important;',
          )

          # 3) Let Chromium skip off-screen plugin cards. Keep layout dimensions stable.
          css_path = Path('packages/client/ui-desktop-customization/src/client/DesktopCustomization.module.css')
          css = css_path.read_text(encoding='utf-8')
          marker = """:global(body[data-dsh-desktop-skin='active'] #root) {\n  background: transparent !important;\n}\n"""
          optimization = marker + """\n/* Desktop performance: do not fully paint off-screen catalog cards. */\n:global(body[data-dsh-desktop-skin='active'] [data-catalog-entry]),\n:global(body[data-dsh-desktop-skin='active'] [data-discovery-entry]),\n:global(body[data-dsh-desktop-skin='active'] [data-catalog-section]) {\n  content-visibility: auto;\n  contain-intrinsic-size: auto 180px;\n}\n"""
          if css.count(marker) != 1:
              raise SystemExit('DesktopCustomization.module.css: root marker mismatch')
          css_path.write_text(css.replace(marker, optimization, 1), encoding='utf-8')

          # 4) Plugin-market pages can have dozens of cards. Replace live blur with the
          # existing translucent fills; this retains the look without per-frame backdrop sampling.
          for path in [
              'packages/client/ui-plugin-center/src/client/PluginDiscoveryPage.module.css',
              'packages/client/ui-plugin-center/src/client/PluginCenterTab.module.css',
          ]:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              text, count = re.subn(r'backdrop-filter:\s*blur\([^;]+\);', 'backdrop-filter: none;', text)
              p.write_text(text, encoding='utf-8')
              print(f'{path}: removed {count} live backdrop blur(s)')

          # 5) Debounce Plugin Center query input and do not force a full npm-index refresh
          # when a non-stale cached discovery result is already available.
          pc = 'packages/client/ui-plugin-center/src/client/PluginCenterTab.tsx'
          replace_once(
              pc,
              """  const [query, setQuery] = useState('')\n  const [revision, setRevision] = useState(0)""",
              """  const [query, setQuery] = useState('')\n  const [debouncedQuery, setDebouncedQuery] = useState('')\n  const [revision, setRevision] = useState(0)""",
          )
          replace_once(
              pc,
              """  const criteria = useMemo<CatalogListQuery>(() => ({\n    catalogKind: kind,\n    scope,\n    query: query.trim(),\n    limit: 24,\n  }), [kind, query, scope])""",
              """  useEffect(() => {\n    const timer = window.setTimeout(() => { setDebouncedQuery(query) }, 220)\n    return () => { window.clearTimeout(timer) }\n  }, [query])\n\n  const criteria = useMemo<CatalogListQuery>(() => ({\n    catalogKind: kind,\n    scope,\n    query: debouncedQuery.trim(),\n    limit: 24,\n  }), [debouncedQuery, kind, scope])""",
          )
          replace_once(
              pc,
              """        if (result.source === 'network' && result.freshness === 'fresh'\n          && uniqueEntries([result]).length >= criteria.limit) return\n        void Promise.resolve().then(() => refresh(criteria)).then(""",
              """        if (result.freshness !== 'stale' && uniqueEntries([result]).length > 0) return\n        void Promise.resolve().then(() => refresh(criteria)).then(""",
          )

          # 6) Same treatment for Plugin Discovery, which otherwise queries on every keypress
          # with a 48-entry result request.
          pd = 'packages/client/ui-plugin-center/src/client/PluginDiscoveryPage.tsx'
          replace_once(
              pd,
              """  const [query, setQuery] = useState('')\n  const [mode, setMode] = useState<DiscoveryMode>('overview')""",
              """  const [query, setQuery] = useState('')\n  const [debouncedQuery, setDebouncedQuery] = useState('')\n  const [mode, setMode] = useState<DiscoveryMode>('overview')""",
          )
          replace_once(
              pd,
              """  const criteria = useMemo<CatalogListQuery>(() => ({\n    catalogKind: 'plugin',\n    scope: 'public',\n    query: query.trim(),\n    limit: 48,\n  }), [query])""",
              """  useEffect(() => {\n    const timer = window.setTimeout(() => { setDebouncedQuery(query) }, 220)\n    return () => { window.clearTimeout(timer) }\n  }, [query])\n\n  const criteria = useMemo<CatalogListQuery>(() => ({\n    catalogKind: 'plugin',\n    scope: 'public',\n    query: debouncedQuery.trim(),\n    limit: 48,\n  }), [debouncedQuery])""",
          )
          replace_once(
              pd,
              """        if (result.source === 'network' && result.freshness === 'fresh') return\n        void Promise.resolve().then(() => refresh(criteria)).then(""",
              """        if (result.freshness !== 'stale' && uniqueEntries(result).length > 0) return\n        void Promise.resolve().then(() => refresh(criteria)).then(""",
          )
          replace_once(
              pd,
              """          {ready !== null && query.trim() !== '' ? (""",
              """          {ready !== null && debouncedQuery.trim() !== '' ? (""",
          )

          # 7) Decode remote catalog artwork off the critical rendering path where possible.
          for path in [pc, pd]:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              text = text.replace('loading="lazy"\n          referrerPolicy=', 'loading="lazy"\n          decoding="async"\n          referrerPolicy=')
              if path == pd:
                  text = text.replace('height={entry.icon.height}\n          referrerPolicy=', 'height={entry.icon.height}\n          decoding="async"\n          referrerPolicy=')
              p.write_text(text, encoding='utf-8')

          # 8) This fork must never update itself from the upstream author's OSS feed.
          manifest_path = Path('apps/desktop/package.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['version'] = '0.1.0-rc.6.1'
          manifest['description'] = 'DeepSeek Harness desktop application with integrated plugin center and performance-tuned Windows shell'
          manifest['build']['publish'] = [{
              'provider': 'github',
              'owner': 'plutoczm',
              'repo': 'deepseek-harness-vscode',
          }]
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Desktop and client contracts
        run: pnpm run typecheck

      - name: Run focused Desktop and Plugin Center tests
        run: pnpm exec vitest run apps/desktop packages/client/ui-plugin-center

      - name: Build production Desktop/Web bundles
        run: pnpm run build

      - name: Commit optimized source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/desktop/package.json \
            apps/desktop/src/main.ts \
            packages/client/ui-desktop-customization/src/client/DesktopCustomization.module.css \
            packages/client/ui-plugin-center/src/client/PluginCenterTab.tsx \
            packages/client/ui-plugin-center/src/client/PluginCenterTab.module.css \
            packages/client/ui-plugin-center/src/client/PluginDiscoveryPage.tsx \
            packages/client/ui-plugin-center/src/client/PluginDiscoveryPage.module.css
          git diff --cached --check
          git commit -m "perf: streamline Windows desktop rendering and plugin discovery"
          git push origin HEAD:main
