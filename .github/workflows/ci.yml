name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Compile extension
        run: npm run compile

      - name: Check Harness plugin syntax
        run: |
          node --check harness-plugin/index.js
          bash -n harness-plugin/bash-env.sh

      - name: Test per-session Bash bootstrap
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/session-env"
          printf 'export DSH_VSCODE_ENV_TEST=selected\n' > "$tmp/session-env/session_1.sh"
          printf 'export DSH_VSCODE_PARENT_TEST=parent\n' > "$tmp/parent-bash-env.sh"
          DSH_SESSION_ID='session/1' \
          DEEPSEEK_HARNESS_SESSION_ENV_DIR="$tmp/session-env" \
          DEEPSEEK_HARNESS_PARENT_BASH_ENV="$tmp/parent-bash-env.sh" \
          BASH_ENV="$PWD/harness-plugin/bash-env.sh" \
          bash -c 'test "$DSH_VSCODE_ENV_TEST" = selected && test "$DSH_VSCODE_PARENT_TEST" = parent'

      - name: Package VSIX
        run: npm run package

      - name: Verify VSIX contents
        run: |
          unzip -l deepseek-harness-vscode.vsix | grep -F 'extension/dist/extension.js'
          unzip -l deepseek-harness-vscode.vsix | grep -F 'extension/harness-plugin/index.js'
          unzip -l deepseek-harness-vscode.vsix | grep -F 'extension/harness-plugin/bash-env.sh'
          unzip -l deepseek-harness-vscode.vsix | grep -F 'extension/harness-plugin/cordis.patch.yml'

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-vscode-vsix
          path: deepseek-harness-vscode.vsix
          if-no-files-found: error
          retention-days: 30
