name: Plugin CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Syntax check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Verify bundle payload
        run: |
          node -e "const p=require('./package.json'); if(!p.dsh?.bundle?.patch) process.exit(1); if(p.dependencies?.['dsh-ssh-remote']) throw new Error('SSH provider must not be a transitive Git dependency')"
          test -f cordis.patch.yml
          test -f src/index.js
      - name: Smoke-test packaged plugin with official Harness
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          npm install -g pnpm@10
          package_file="$(npm pack --silent | tail -n 1)"
          package_path="$PWD/$package_file"

          boot_check() {
            local home="$1"
            local port="$2"
            local log="$3"
            export DSH_HOME="$home"
            npx --yes @deepseek-ai/dsh --profile web --port "$port" >"$log" 2>&1 &
            local pid=$!
            local ready=0
            for _ in $(seq 1 360); do
              if curl -fsS "http://127.0.0.1:$port/" >/dev/null 2>&1; then
                ready=1
                break
              fi
              if ! kill -0 "$pid" 2>/dev/null; then
                cat "$log"
                wait "$pid" || true
                return 1
              fi
              sleep 0.5
            done
            if [ "$ready" -ne 1 ]; then
              cat "$log"
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
              return 1
            fi
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }

          # The bridge must never make Harness unbootable just because the SSH
          # provider is absent or disabled. Its sshRemote scope should wait
          # dynamically instead of leaving the loader entry pending.
          export DSH_HOME="$RUNNER_TEMP/dsh-bridge-only-${{ matrix.node }}"
          npx --yes @deepseek-ai/dsh plugin --profile web add "$package_path"
          boot_check "$DSH_HOME" 33081 "$RUNNER_TEMP/dsh-bridge-only-${{ matrix.node }}.log"

          # Full composition: keep the SSH provider a visible top-level plugin
          # to satisfy pnpm blockExoticSubdeps, then add the bridge.
          export DSH_HOME="$RUNNER_TEMP/dsh-ssh-vpn-smoke-${{ matrix.node }}"
          npx --yes @deepseek-ai/dsh plugin --profile web add 'github:CrazyShout/dsh-ssh-remote#72a2ac6b0f277ab0706ee93634dee2c639070728'
          npx --yes @deepseek-ai/dsh plugin --profile web add "$package_path"
          boot_check "$DSH_HOME" 33082 "$RUNNER_TEMP/dsh-ssh-vpn-${{ matrix.node }}.log"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Windows OpenSSH client
        shell: pwsh
        run: |
          $ssh = Get-Command ssh.exe -ErrorAction Stop
          Write-Host "OpenSSH: $($ssh.Source)"
          ssh -V
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Syntax check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Pack plugin
        shell: pwsh
        run: |
          $package = (npm pack --silent | Select-Object -Last 1).Trim()
          if (-not (Test-Path $package)) { throw "npm pack did not create $package" }
          Write-Host "Packed: $package"
