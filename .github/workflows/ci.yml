name: Plugin CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Syntax check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Verify bundle payload
        run: |
          node -e "const p=require('./package.json'); if(!p.dsh?.bundle?.patch) process.exit(1)"
          test -f cordis.patch.yml
          test -f src/index.js
