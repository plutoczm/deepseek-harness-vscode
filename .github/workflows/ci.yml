name: Plugin CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Syntax check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Verify bundle payload
        run: |
          node -e "const p=require('./package.json'); if(!p.dsh?.bundle?.patch) process.exit(1)"
          test -f cordis.patch.yml
          test -f src/index.js
      - name: Smoke-test packaged plugin with official Harness
        if: matrix.node == 22
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          npm install -g pnpm@10
          export DSH_HOME="$RUNNER_TEMP/dsh-ssh-vpn-smoke"
          package_file="$(npm pack --silent | tail -n 1)"

          npx --yes @deepseek-ai/dsh plugin --profile web add "$PWD/$package_file"

          log="$RUNNER_TEMP/dsh-ssh-vpn-web.log"
          npx --yes @deepseek-ai/dsh --profile web --port 33082 >"$log" 2>&1 &
          pid=$!
          cleanup() {
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          trap 'cleanup' EXIT

          ready=0
          for _ in $(seq 1 360); do
            if curl -fsS http://127.0.0.1:33082/ >/dev/null 2>&1; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat "$log"
              exit 1
            fi
            sleep 0.5
          done
          if [ "$ready" -ne 1 ]; then
            cat "$log"
            exit 1
          fi

          cleanup
          trap - EXIT

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Windows OpenSSH client
        shell: pwsh
        run: |
          $ssh = Get-Command ssh.exe -ErrorAction Stop
          Write-Host "OpenSSH: $($ssh.Source)"
          ssh -V
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Syntax check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Pack plugin
        shell: pwsh
        run: |
          $package = (npm pack --silent | Select-Object -Last 1).Trim()
          if (-not (Test-Path $package)) { throw "npm pack did not create $package" }
          Write-Host "Packed: $package"
