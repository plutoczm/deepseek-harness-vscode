name: Publish VS Code Marketplace

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Validate Marketplace manifest
        run: |
          node <<'NODE'
          const pkg = require('./package.json');
          if (!/^\d+\.\d+\.\d+$/.test(pkg.version)) {
            throw new Error(`Marketplace version must be major.minor.patch, got ${pkg.version}`);
          }
          if (pkg.publisher !== 'plutoczm') {
            throw new Error(`Expected publisher "plutoczm", got ${pkg.publisher}`);
          }
          console.log(`Publishing ${pkg.publisher}.${pkg.name}@${pkg.version}`);
          NODE

      - name: Compile extension
        run: npm run compile

      - name: Check Harness plugin syntax
        run: |
          node --check harness-plugin/index.js
          bash -n harness-plugin/bash-env.sh

      - name: Verify package contents
        run: |
          npx vsce package --out deepseek-harness-vscode.vsix
          unzip -l deepseek-harness-vscode.vsix | grep -F 'extension/dist/extension.js'
          unzip -l deepseek-harness-vscode.vsix | grep -F 'extension/harness-plugin/index.js'
          unzip -l deepseek-harness-vscode.vsix | grep -F 'extension/harness-plugin/bash-env.sh'
          unzip -l deepseek-harness-vscode.vsix | grep -F 'extension/harness-plugin/cordis.patch.yml'

      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo '::error::Missing repository secret VSCE_PAT. Create a Visual Studio Marketplace publisher/PAT and add it under GitHub Settings > Secrets and variables > Actions.'
            exit 1
          fi
          npx vsce publish
