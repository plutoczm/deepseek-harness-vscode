name: Persist Vendored dsh-remote Runtime Once

on:
  push:
    paths:
      - '.github/workflows/optimize-desktop-once-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  persist-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Restore validated enhanced runtime files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .dsh-remote-stage
          mkdir -p .dsh-remote-stage
          curl --fail --location --retry 3 \
            'https://github.com/flymysql/dsh-remote/archive/bd56bcd6435aec08e6ac583c21d39bb9e81f1022.tar.gz' \
            | tar -xz --strip-components=1 -C .dsh-remote-stage
          {
            git show 543b325c345eba9142972c528d83e8af22e6fa88:.scorpion/proxy.001.b64
            git show 543b325c345eba9142972c528d83e8af22e6fa88:.scorpion/proxy.002.b64
          } | tr -d '\n\r' | base64 -d | gzip -d > /tmp/dsh-remote.patch
          git apply --check --directory=.dsh-remote-stage /tmp/dsh-remote.patch
          git apply --directory=.dsh-remote-stage /tmp/dsh-remote.patch
          rm -rf third_party/dsh-remote/lib
          cp -a .dsh-remote-stage/lib third_party/dsh-remote/lib
          rm -rf .dsh-remote-stage
          test -f third_party/dsh-remote/lib/index.js
          test -f third_party/dsh-remote/lib/client.js
          grep -Fq 'forwardIn(remoteHost, requestedPort' third_party/dsh-remote/lib/index.js
          grep -Fq 'rw_proxy_tunnel' third_party/dsh-remote/lib/index.js
          grep -Fq 'SSH 反向代理' third_party/dsh-remote/lib/client.js
          node --check third_party/dsh-remote/lib/index.js
          node --check third_party/dsh-remote/lib/client.js

      - name: Verify fresh workspace resolution
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm install --frozen-lockfile
          pnpm --dir apps/desktop/runtime exec node -e "const p=require('dsh-remote/package.json'); if(p.version!=='0.5.7') process.exit(1); console.log(require.resolve('dsh-remote'));"

      - name: Commit vendored runtime files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f third_party/dsh-remote/lib
          git status --short
          git diff --cached --quiet && { echo 'No runtime files to persist'; exit 1; }
          git commit -m 'fix: persist enhanced dsh-remote runtime files'
          git push origin HEAD:main
