        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node 24 without package-manager cache
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          node --version
          pnpm --version

