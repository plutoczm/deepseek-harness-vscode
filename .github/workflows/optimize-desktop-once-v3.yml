name: Finalize Scorpion Desktop Once

on:
  push:
    paths:
      - '.github/workflows/optimize-desktop-once-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          node --version
          pnpm --version

      - name: Vendor and enhance marketplace dsh-remote 0.5.7
        shell: bash
        run: |
          set -euo pipefail
          rm -rf third_party/dsh-remote
          mkdir -p third_party/dsh-remote
          curl --fail --location --retry 3 \
            'https://github.com/flymysql/dsh-remote/archive/bd56bcd6435aec08e6ac583c21d39bb9e81f1022.tar.gz' \
            | tar -xz --strip-components=1 -C third_party/dsh-remote
          cat .scorpion/proxy.*.b64 | tr -d '\n\r' | base64 -d | gzip -d > /tmp/dsh-remote.patch
          git -C third_party/dsh-remote apply --check /tmp/dsh-remote.patch
          git -C third_party/dsh-remote apply /tmp/dsh-remote.patch
          node --check third_party/dsh-remote/lib/index.js
          node --check third_party/dsh-remote/lib/client.js
          node -e "const p=require('./third_party/dsh-remote/package.json'); if(p.name!=='dsh-remote'||p.version!=='0.5.7'||p.license!=='MIT') process.exit(1)"

      - name: Keep Plugin Center as the only marketplace entry
        shell: bash
        run: |
          set -euo pipefail
          cat .scorpion/plugin-center-index.b64 | tr -d '\n\r' | base64 -d | gzip -d > packages/client/ui-plugin-center/src/client/index.ts
          cat .scorpion/plugin-center-test.b64 | tr -d '\n\r' | base64 -d | gzip -d > packages/client/ui-plugin-center/tests/apply.client.spec.ts
          rm -f \
            packages/client/ui-plugin-center/src/client/PluginDiscoveryNavItem.tsx \
            packages/client/ui-plugin-center/src/client/PluginDiscoveryPage.tsx \
            packages/client/ui-plugin-center/src/client/PluginDiscoveryPage.module.css \
            packages/client/ui-plugin-center/tests/discovery.client.spec.tsx
          if grep -nE 'PluginDiscovery|plugin-discovery' packages/client/ui-plugin-center/src/client/index.ts; then
            echo 'Plugin Discovery is still registered' >&2
            exit 1
          fi

      - name: Apply conservative Windows performance and release hardening
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import json

          def one(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: replacement mismatch: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          one('apps/desktop/src/main.ts',
              "      backgroundMaterial: 'acrylic' as const,\n      hasShadow: true,",
              "      backgroundColor: '#07111d',\n      hasShadow: true,")
          one('packages/client/ui-desktop-customization/src/client/DesktopCustomization.module.css',
              '  background-attachment: fixed, fixed !important;',
              '  background-attachment: scroll, scroll !important;')

          desktop_path = Path('apps/desktop/package.json')
          desktop = json.loads(desktop_path.read_text(encoding='utf-8'))
          desktop['version'] = '0.1.0-rc.6.1'
          desktop['description'] = 'DeepSeek Harness desktop application with Scorpion branding, integrated Plugin Center, and performance-tuned Windows shell'
          desktop['build']['publish'] = [{'provider': 'github', 'owner': 'plutoczm', 'repo': 'deepseek-harness-vscode'}]
          desktop_path.write_text(json.dumps(desktop, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          runtime_path = Path('apps/desktop/runtime/package.json')
          runtime = json.loads(runtime_path.read_text(encoding='utf-8'))
          runtime['dependencies']['dsh-remote'] = 'workspace:*'
          runtime_path.write_text(json.dumps(runtime, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          workspace = Path('pnpm-workspace.yaml')
          w = workspace.read_text(encoding='utf-8')
          if '  - third_party/*\n' not in w:
              marker = '  - vendor/*\n'
              if w.count(marker) != 1:
                  raise SystemExit('pnpm workspace marker mismatch')
              w = w.replace(marker, marker + '  - third_party/*\n', 1)
          if '  ssh2: false\n' not in w or '  cpu-features: false\n' not in w:
              marker = '  electron-winstaller: false\n'
              if w.count(marker) != 1:
                  raise SystemExit('allowBuilds marker mismatch')
              w = w.replace(marker, marker + '  ssh2: false\n  cpu-features: false\n', 1)
          workspace.write_text(w, encoding='utf-8')
          PY

      - name: Install dependencies and refresh lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Verify enhanced dsh-remote resolves from Desktop runtime
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir apps/desktop/runtime exec node -e "const p=require('dsh-remote/package.json'); console.log(require.resolve('dsh-remote/package.json')); if(p.version!=='0.5.7') process.exit(1)"

      - name: Typecheck
        id: typecheck
        shell: bash
        run: |
          set +e
          pnpm run typecheck > typecheck-errors.txt 2>&1
          code=$?
          cat typecheck-errors.txt
          exit $code

      - name: Upload typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finalizer-typecheck-errors
          path: typecheck-errors.txt
          retention-days: 1

      - name: Desktop and Plugin Center tests
        run: pnpm exec vitest run apps/desktop packages/client/ui-plugin-center

      - name: Production build
        run: pnpm run build

      - name: Final source assertions
        shell: bash
        run: |
          set -euo pipefail
          test -f third_party/dsh-remote/SCORPION.md
          grep -q 'forwardIn(remoteHost, requestedPort' third_party/dsh-remote/lib/index.js
          grep -q 'rw_proxy_tunnel' third_party/dsh-remote/lib/index.js
          grep -q 'SSH 反向代理' third_party/dsh-remote/lib/client.js
          ! test -e packages/client/ui-plugin-center/src/client/PluginDiscoveryPage.tsx
          ! test -e packages/client/ui-plugin-center/src/client/PluginDiscoveryNavItem.tsx
          ! test -e packages/client/ui-plugin-center/tests/discovery.client.spec.tsx
          ! grep -qE 'PluginDiscovery|plugin-discovery' packages/client/ui-plugin-center/src/client/index.ts
          ! grep -q "backgroundMaterial: 'acrylic'" apps/desktop/src/main.ts
          grep -q "backgroundColor: '#07111d'" apps/desktop/src/main.ts
          grep -q '"provider": "github"' apps/desktop/package.json
          grep -q '  ssh2: false' pnpm-workspace.yaml
          grep -q '  cpu-features: false' pnpm-workspace.yaml

      - name: Commit validated source and remove temporary staging files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf .scorpion
          git rm -f .github/workflows/optimize-desktop-once-v3.yml
          git add -A
          git diff --cached --check
          git status --short
          git commit -m 'feat: finalize Scorpion desktop and remote proxy workflow'
          git push origin HEAD:main
