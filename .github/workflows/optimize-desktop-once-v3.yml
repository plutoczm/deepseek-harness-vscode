name: Verify Final Source and Build Windows Once

on:
  push:
    paths:
      - '.github/workflows/optimize-desktop-once-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout final main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Enable pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Final source assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'setDebouncedQuery(query) }, 220' packages/client/ui-plugin-center/src/client/PluginCenterTab.tsx
          grep -Fq 'const listCache = useRef(new Map<string, CatalogListResult>())' packages/client/ui-plugin-center/src/client/PluginCenterTab.tsx
          grep -Fq 'cached.freshness' packages/client/ui-plugin-center/src/client/PluginCenterTab.tsx
          grep -Fq 'decoding="async"' packages/client/ui-plugin-center/src/client/PluginCenterTab.tsx
          grep -Fq 'content-visibility: auto' packages/client/ui-plugin-center/src/client/PluginCenterTab.module.css
          grep -Fq 'content-visibility: auto' packages/client/ui-conversation/src/client/chat/ChatView.module.css
          ! git grep -n 'backdrop-filter'
          ! git grep -n '赋范空间出品'
          ! git grep -nE 'PluginDiscovery|plugin-discovery' -- packages/client/ui-plugin-center/src/client packages/client/ui-plugin-center/tsconfig.client.json
          test -f third_party/dsh-remote/lib/index.js
          test -f third_party/dsh-remote/lib/client.js
          grep -Fq 'forwardIn(remoteHost, requestedPort' third_party/dsh-remote/lib/index.js
          grep -Fq 'rw_proxy_tunnel' third_party/dsh-remote/lib/index.js
          grep -Fq 'SSH 反向代理' third_party/dsh-remote/lib/client.js
          grep -Fq '"dsh-remote": "workspace:*"' apps/desktop/runtime/package.json
          grep -Fq '"provider": "github"' apps/desktop/package.json
          grep -Fq '"owner": "plutoczm"' apps/desktop/package.json
          grep -Fq '"repo": "deepseek-harness-vscode"' apps/desktop/package.json
          grep -Fq "backgroundColor: '#07111d'" apps/desktop/src/main.ts
          grep -Fq 'scripts/stage-runtime-win.ts' apps/desktop/package.json
          ! grep -Fq 'DSH_DESKTOP_TARGET_PLATFORM=win32 ' apps/desktop/package.json
          grep -Fq "process.env.DSH_DESKTOP_TARGET_PLATFORM = 'win32'" apps/desktop/scripts/stage-runtime-win.ts
          grep -Fq "process.env.DSH_DESKTOP_TARGET_ARCH = 'x64'" apps/desktop/scripts/stage-runtime-win.ts
          grep -Fq "await import('./stage-runtime.ts')" apps/desktop/scripts/stage-runtime-win.ts

      - name: Typecheck
        run: pnpm run typecheck

      - name: Production build
        run: pnpm run build

      - name: Affected tests
        run: pnpm exec vitest run apps/desktop packages/client/ui-plugin-center packages/client/ui-conversation

  windows-installer:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout final main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Enable pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace on Windows
        run: pnpm run build

      - name: Stage Windows x64 runtime
        run: node --import tsx apps/desktop/scripts/stage-runtime-win.ts

      - name: Build final NSIS Setup.exe
        shell: pwsh
        run: |
          Push-Location apps/desktop
          try {
            node --import tsx scripts/release-win.ts
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }

      - name: Collect installer and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $installer = Get-ChildItem -Path apps/desktop -Recurse -File -Filter '*Setup.exe' |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if (-not $installer) { throw 'Windows Setup.exe was not produced' }
          Copy-Item $installer.FullName -Destination artifacts/
          $copied = Get-ChildItem artifacts -File -Filter '*.exe' | Select-Object -First 1
          $hash = Get-FileHash $copied.FullName -Algorithm SHA256
          "$($hash.Hash)  $($copied.Name)" | Set-Content -Encoding ascii artifacts/SHA256SUMS.txt
          Get-ChildItem artifacts | Format-Table Name, Length
          Get-Content artifacts/SHA256SUMS.txt

      - name: Upload final Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: scorpion-windows-setup-final
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
