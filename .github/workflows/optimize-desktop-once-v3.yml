      - name: Apply conservative Windows performance and release hardening
        shell: bash
        run: |
          python <<'PYCODE'
          from pathlib import Path
          import json, re

          def one(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: exact replacement mismatch: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          main = 'apps/desktop/src/main.ts'
          one(main, "backgroundMaterial: 'acrylic' as const,", "backgroundMaterial: 'none' as const,\n      backgroundColor: '#07111d',")
          one(main, "      sandbox: true,\n      webSecurity: true,", "      sandbox: true,\n      webSecurity: true,\n      backgroundThrottling: true,")

          skin = 'packages/client/ui-desktop-customization/src/client/DesktopCustomization.module.css'
          one(skin, '  background-attachment: fixed, fixed !important;', '  background-attachment: scroll, scroll !important;')

          css = Path('packages/client/ui-plugin-center/src/client/PluginCenterTab.module.css')
          text = css.read_text(encoding='utf-8')
          text, count = re.subn(r'backdrop-filter:\s*blur\([^;]+\);', 'backdrop-filter: none;', text)
          if count == 0:
              raise SystemExit('PluginCenterTab CSS had no live backdrop blur rule to optimize')
          css.write_text(text, encoding='utf-8')
          print(f'disabled {count} Plugin Center live blur rule(s)')

          desktop_manifest = Path('apps/desktop/package.json')
          desktop = json.loads(desktop_manifest.read_text(encoding='utf-8'))
          desktop['version'] = '0.1.0-rc.6.1'
          desktop['description'] = 'DeepSeek Harness desktop application with integrated Plugin Center, Scorpion branding, and performance-tuned Windows shell'
          desktop['build']['publish'] = [{'provider': 'github', 'owner': 'plutoczm', 'repo': 'deepseek-harness-vscode'}]
          desktop_manifest.write_text(json.dumps(desktop, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          runtime_manifest = Path('apps/desktop/runtime/package.json')
          runtime = json.loads(runtime_manifest.read_text(encoding='utf-8'))
          runtime['dependencies']['dsh-remote'] = 'workspace:*'
          runtime['dependencies'] = dict(sorted(runtime['dependencies'].items()))
          runtime_manifest.write_text(json.dumps(runtime, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          center_manifest = Path('packages/client/ui-plugin-center/package.json')
          center = json.loads(center_manifest.read_text(encoding='utf-8'))
          center['description'] = 'Desktop-only Plugin Center for browsing, installing, updating, and managing Harness plugins'
          center['dsh']['client']['inject'] = [x for x in center['dsh']['client']['inject'] if x not in {
              '@deepseek-ai/dsh-client-connection', '@deepseek-ai/dsh-client-ui-conversation'
          }]
          center_manifest.write_text(json.dumps(center, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          workspace = Path('pnpm-workspace.yaml')
          w = workspace.read_text(encoding='utf-8')
          marker = '  - vendor/*\n'
          if '  - third_party/*\n' not in w:
              if w.count(marker) != 1:
                  raise SystemExit('pnpm workspace vendor marker mismatch')
              w = w.replace(marker, marker + '  - third_party/*\n', 1)
          workspace.write_text(w, encoding='utf-8')
          PYCODE

      - name: Install dependencies and update lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Verify vendored dsh-remote resolves from Desktop runtime
        shell: bash
        run: |
          set -euo pipefail
          resolved="$(pnpm --dir apps/desktop/runtime exec node -p \"require.resolve('dsh-remote/package.json')\")"
          echo "$resolved"
          test -n "$resolved"
          pnpm --dir apps/desktop/runtime exec node -e "const p=require('dsh-remote/package.json'); if(p.version!=='0.5.7') process.exit(1)"

      - name: Typecheck
        run: pnpm run typecheck

      - name: Plugin Center and Desktop tests
        run: pnpm exec vitest run apps/desktop packages/client/ui-plugin-center

      - name: Production build
        run: pnpm run build

      - name: Source assertions
        shell: bash
        run: |
          set -euo pipefail
          test -f third_party/dsh-remote/SCORPION.md
          grep -q "forwardIn(remoteHost, requestedPort" third_party/dsh-remote/lib/index.js
          grep -q "rw_proxy_tunnel" third_party/dsh-remote/lib/index.js
          grep -q "SSH 反向代理" third_party/dsh-remote/lib/client.js
          ! grep -q "PluginDiscovery" packages/client/ui-plugin-center/src/client/index.ts
          ! grep -q "plugin-discovery" packages/client/ui-plugin-center/src/client/index.ts
          grep -q "backgroundMaterial: 'none'" apps/desktop/src/main.ts
          grep -q '"provider": "github"' apps/desktop/package.json

      - name: Commit validated final source and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/optimize-desktop-once-v3.yml
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "feat: finalize Scorpion desktop and remote proxy workflow"
          git push origin HEAD:main
