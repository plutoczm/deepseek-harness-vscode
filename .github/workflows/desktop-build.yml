name: Desktop App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'remote/**'
      - '.github/workflows/desktop-build.yml'
  pull_request:
    paths:
      - 'remote/**'
      - '.github/workflows/desktop-build.yml'

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: remote
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund
      - name: Check launcher
        shell: bash
        run: npm run check
      - name: Run unit tests
        run: npm test
      - name: Build Windows installer
        run: npm run desktop:win
      - name: Verify packaged PDF.js runtime
        shell: pwsh
        run: |
          $required = @(
            'dist/win-unpacked/resources/pdfjs-dist/build/pdf.mjs',
            'dist/win-unpacked/resources/pdfjs-dist/build/pdf.worker.mjs'
          )
          foreach ($path in $required) {
            if (!(Test-Path $path)) { throw "Missing packaged PDF.js asset: $path" }
          }
          $assetDirs = @(
            'dist/win-unpacked/resources/pdfjs-dist/cmaps',
            'dist/win-unpacked/resources/pdfjs-dist/standard_fonts',
            'dist/win-unpacked/resources/pdfjs-dist/wasm'
          )
          foreach ($dir in $assetDirs) {
            if (!(Test-Path $dir)) { throw "Missing packaged PDF.js asset directory: $dir" }
            $files = Get-ChildItem $dir -File -Recurse -ErrorAction Stop
            if ($files.Count -lt 1) { throw "Packaged PDF.js asset directory is empty: $dir" }
          }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-Remote-Windows-x64
          path: remote/dist/*.exe
          if-no-files-found: error
